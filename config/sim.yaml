# 비콘 시뮬레이터 런타임 설정. 센서 장착 포즈는 config/robot.yaml.
# 토픽 이름은 실차와 맞출 때 여기만 바꾸면 된다.

# 도로 맵 (roadgen.RoadParams). 같은 값이면 항상 같은 맵. GUI(beacon_app)에서 만든 map_meta.json의 params를 붙여넣어도 됨
map:
  seed: 7                 # -1 = 실행마다 랜덤 (결정값은 로그와 /sim/scenario 에)
  length: 3000.0
  lanes: 2
  design_speed: 100
  tunnels: 1
  gantries: 2
  wear: 0.3               # 차선 상태 나쁜 구간 비율 (희미함/끊김/희소)
  wear_faded: 1.0
  wear_broken: 1.0
  wear_sparse: 1.0
  paint_var: 0.5          # 도색 밝기 편차 0~1 (선마다 다른 밝기 + 선을 따라 서서히 흐려짐)
  outer_rail: mixed       # 바깥 방호시설: guardrail | concrete | mixed (구간마다)
  gutter_w: 0.5           # 바깥 측구 폭 [m] (방호시설 앞 콘크리트 띠, 0 = 없음)
  gutter_med_w: 0.3       # 중앙분리대 쪽 측구 폭 [m]
  curb_h: 0.12            # 가드레일 구간 연석 높이 [m]
  roadside_clutter: 0.5   # 도로 밖 덤불 밀도 0~1

# 2차 사고 예방 시나리오 (traffic.ScenarioParams). 비콘은 사고 차량 후미에 역방향으로 '배치'만 되고,
# 이동은 상위 제어기가 /cmd_vel 로 한다.
scenario:
  seed: -1                # -1 = 실행마다 랜덤
  side: random            # random | down(하행) | up(상행)
  lane: -1                # -1 랜덤, 0 = 1차로(중앙분리대 쪽)
  accident_s: -1.0        # -1 랜덤
  accident_vehicles: 2
  accident_where: random  # random | open | tunnel_entry | tunnel | tunnel_exit
  accident_type: basic    # basic(단독) | chain(연쇄 추돌) | truck(대형차 차로 막음) | random
  pedestrians: 0          # 사고 운전자(보행자) 0~4, -1 = 랜덤 0~2
  p_ped_in_lane: 0.3      # 보행자가 차로 위(사고 차 옆)에 있을 확률
  beacon_light: true      # 비콘 경광등 (야간 운전자 인지 거리에 영향)
  flash_hz: 3.0           # (임시) 경광등 점멸 주기 [Hz] (적·청 한 번씩 = 1 주기) — 실행 중 바꿀 수 있음
  warning_pattern: alternate   # alternate(적·청 번갈아) | sync(동시) | steady(계속)
  searchlight: auto       # auto(황혼·밤·터널·짙은 안개) | on | off
  start_gap: 6.0

# 접근 차량 (traffic.TrafficParams). 반응 비율은 합으로 정규화
traffic:
  enabled: true           # false = 기능 검증 모드 (차량 없음)
  flow: 900.0             # 비콘 쪽 차로당 [대/h]
  flow_opposite: 600.0
  speed_mean: 27.0        # [m/s]
  speed_std: 3.0
  truck_ratio: 0.2
  p_lane_change: 0.6
  p_brake: 0.3
  p_crash: 0.1            # 무반응 → 비콘/사고 차량 추돌
  notice_min: 60.0        # 비콘 인지 거리 [m]
  notice_max: 250.0
  max_vehicles: 200       # 슬롯 상한 (3~4차로·긴 맵이면 부족할 수 있음)
  # SCC (적응형 순항): 차마다 아래 범위에서 무작위 (상용 범위: ISO 15622 자동 감속 ≤ 3.5 m/s², 차간 단계 1.0~2.2 s,
  #   전방 레이더 150~250 m, 정지 물체는 무시하거나 저속에서만 반응)
  p_scc: 0.4              # SCC 작동 차량 비율
  scc_gap_min: 1.0        # 차간 시간 단계 {1.0, 1.4, 1.8, 2.2} s 중 이 범위
  scc_gap_max: 2.2
  scc_decel_min: 2.5      # 최대 감속도 [m/s²] (대부분)
  scc_decel_max: 3.5
  p_scc_strong: 0.2       # 이 비율은 scc_decel_max ~ scc_decel_strong 로 더 세게 감속
  scc_decel_strong: 5.0
  scc_range_min: 150.0    # 레이더 앞차 인식 거리 [m]
  scc_range: 250.0
  scc_beacon_min: 0.45    # 비콘 인식 거리 배율 (반사 면적이 작음)
  scc_beacon_max: 0.7
  p_scc_static_ignore: 0.4     # 정지 물체를 무시하는 차 비율
  scc_static_vmax_min: 30.0    # 나머지는 자기 속도가 이 범위 [km/h] 이하일 때만 정지 물체에 반응
  scc_static_vmax_max: 70.0
  scc_acq_min: 0.3        # 새 대상 인식 지연 [s]
  scc_acq_max: 1.5
  scc_lat_min: 1.4        # 진행 경로 폭의 절반 [m] — 비콘이 차선 쪽으로 붙으면 옆 차로 차가 오탐
  scc_lat_max: 2.1
  scc_moving_min: 0.5     # 비콘을 이동 물체로 보는 최소 속도 [m/s]

# 실환경 (environment.EnvParams): random 이면 실행마다 랜덤, 지정도 가능
environment:
  seed: -1
  time_of_day: random     # random | day | dusk | night
  weather: random         # random | clear | rain | fog | snow
  intensity: -1.0         # 날씨 강도 0~1, -1 랜덤
  p_night: 0.3
  p_dusk: 0.15
  p_rain: 0.25
  p_fog: 0.1
  p_snow: 0.1
  # 야간 조도 (황혼·밤): -1 / random 이면 실행마다 랜덤
  moon: -1.0              # 달빛 0(그믐) ~ 1(보름)
  sky_glow: -1.0          # 하늘 밝음(도시 광공해) 0 ~ 1
  street_lights: random   # random | all | partial | none
  street_coverage: -1.0   # partial 일 때 가로등 구간 비율
  lamp_fail: -1.0         # 고장(꺼진) 가로등 비율
beacon_lights:            # 비콘 조명 (위치는 robot.yaml lights:) — (임시) 값은 실기 사양으로 고칠 것
  searchlight:
    power_lm: 10000.0     # (임시) 광속 [lm] — 실물은 마주 보면 눈이 부실 정도
    beam_deg: 30.0        # (임시) 빔 전체 각
    range_m: 150.0        # 빛이 닿는 거리 (렌더 한계)
    tilt_deg: 0.5         # 아래로 숙임 [°] (등 높이 약 0.49 m: 3° 면 9 m 앞 바닥에 꽂힘)
    energy_per_klm: 6.0   # 화면 밝기 환산 (1000 lm 당 Godot 세기)
    color: [1.0, 0.97, 0.92]
  warning:
    beam_deg: 70.0        # (임시) 전방으로 쏘는 빔 전체 각
    range_m: 40.0         # 빛이 닿는 거리
    tilt_deg: 2.0         # 아래로 숙임 [°]
    energy: 4.0           # (임시) 화면 세기 (Godot)

# u-blox ZED-F9P 모델 (gnss.GnssParams)
ground_truth:             # 정답 (base_link 기준, 비콘 주변만)
  objects_topic: /ground_truth/objects        # autoware_perception_msgs/PredictedObjects — 주행 차량 3D 박스, object_id = 차량 번호, 속도
  objects_frame: base_link  # base_link | map
  objects_rate_hz: 10.0
  objects_range: 200.0      # 비콘에서 이 거리 안의 차량만 [m]
  lanes_topic: /ground_truth/lanes            # PointCloud2 — 차선 3D 중심선 점 (x,y,z,line_id,kind,side,painted,wear)
  lanes_rate_hz: 10.0
  lanes_behind: 30.0        # 비콘 뒤 범위 [m] (비콘이 바라보는 방향 기준)
  lanes_ahead: 100.0        # 비콘 앞 범위 [m] (비콘이 바라보는 방향 기준)
  lanes_step: 1.0           # 점 간격 [m]
  markers: true             # RViz 용 MarkerArray (<토픽>/markers)
drive:                    # 좌우 모터 차동(스키드 스티어) 모델 — (임시) 값은 실기 사양으로 고칠 것
  gear_ratio: 10.0          # (임시) 모터 → 바퀴 감속비
  counts_per_motor_rev: 4096.0   # (임시) 엔코더 카운트 / 모터 1회전
  motor_max_rpm: 3000.0     # (임시)
  tau: 0.12                 # 바퀴 속도 응답 시정수 [s]
  accel_max: 1.5            # 바퀴 선가속 한계 [m/s²]
  track_eff_factor: 1.35    # 스키드 스티어: 실제 회전 = 바퀴 속도차 / (윤거 × 이 값)
  odom_track_factor: 1.35   # 오도메트리 계산용 (보정된 값이면 위와 같게)
  slip_std: 0.01            # 바퀴 접지 속도 잡음 (비율)
  wait_tower_up: true       # 자율(ROS) 주행 명령은 센서타워가 다 펴진 뒤에 (실기 AUTO 동작). 키보드는 수동이라 허용
  odom_rate_hz: 50.0
imu:
  enabled: true
  topic: /sensing/imu/imu_raw
  frame_id: imu_link
  rate_hz: 100.0
  xyz: [0.0, 0.0, 0.25]     # (임시) base_link 기준 장착 위치
  gyro_noise: 0.002         # rad/s
  gyro_bias_walk: 2.0e-5
  accel_noise: 0.05         # m/s²
  accel_bias_walk: 5.0e-4
gnss:
  enabled: true
  topic: /sensing/gnss/fix
  frame_id: gnss_link
  antenna_xyz: [0.0, 0.0, 0.0]   # base_link 기준 안테나 위치 [m] (실측 후 수정, 모델 정답 위치도 이 점 기준으로 바꿀 것)
  rate_hz: 10.0
  depth_lost: 15.0        # 터널 입구에서 이만큼 들어가면 신호 단절 [m]
  approach: 20.0          # 갱문 주변 SINGLE 구간 [m]
  t_single_min: 1.0
  t_single_max: 3.0
  t_conv_min: 10.0        # FLOAT → FIX 재수렴 [s]
  t_conv_max: 60.0

sim:
  step_hz: 100            # 코어 루프(시계, 기구학, TF)
  real_time_factor: 1.0
  start_time_sec: 1.0     # /clock 시작값 (0은 '미설정'으로 취급되는 노드가 있어 피함)
  map_frame: map
  base_frame: base_link
  cmd_vel_topic: /cmd_vel
  cmd_vel_timeout: 0.3     # 실기 제어기: 명령 300 ms 끊기면 정지
  max_linear: 3.0         # m/s
  max_angular: 1.5        # rad/s
  odom_topic: /ground_truth/odom
  scene_topic: /sim/scene_markers
  npc_topic: /sim/npc_markers
  traffic_topic: /sim/traffic      # PoseArray, 슬롯 순서 고정 (비활성 슬롯은 z=-1000)
  events_topic: /sim/events        # JSON: 인지/감속/차로변경/추돌
  scenario_topic: /sim/scenario    # JSON (latched): 사고 위치, 비콘 배치, 환경
  searchlight_topic: /beacon/searchlight        # std_msgs/Bool 서치라이트 켜기/끄기 (받으면 자동 설정보다 우선)
  warning_light_topic: /beacon/warning_light    # std_msgs/Bool 경광등 켜기/끄기
  wheel_odom_topic: /beacon/wheel_odom   # nav_msgs/Odometry (엔코더 적분, frame odom → base_link, TF 는 안 냄)
  deploy_topic: /beacon/deploy     # std_msgs/Bool: true 센서타워 펴기, false 접기 (상위 제어기)
  joint_states_topic: /joint_states   # sensor_msgs/JointState: sensor_tower_joint (0 접힘 ~ 펴짐 각도)

pandar40p:
  enabled: true
  rate_hz: 10.0
  topic: /sensing/lidar/pandar/pointcloud_raw_ex      # nebula PointXYZIRCAEDT 형식
  gt_topic: /ground_truth/lidar/pandar/labels         # 점별 시맨틱 라벨 (x,y,z,intensity,label)
  sensor_id: 1001
  min_range: 0.3
  max_range: 200.0
  range_at_10pct: 200.0
  range_noise_std: 0.02
  azimuth_resolution_deg: 0.2
  intensity_model: hesai_v1   # 실기 bag 측정에 맞춘 클래스별 밝기 (노면·도색·배리어). 빼면 예전 단순 모델

tele15:
  enabled: true
  rate_hz: 10.0
  topic: /sensing/lidar/livox/points                  # livox_ros_driver2 PointCloud2 (xfer_format=0) 형식
  sensor_id: 1002
  pattern_csv: third_party/ref/tele.csv               # 240k pts/s 비반복 스캔 (livox_laser_simulation)
  min_range: 0.1
  max_range: 500.0
  range_at_10pct: 320.0
  range_noise_std: 0.02

ars408:
  enabled: true
  rate_hz: 14.0           # ARS408 사이클 약 72ms
  cluster_topic: /sensing/radar/ars408/clusters       # PointCloud2 (RViz 확인용)
  scan_topic: /sensing/radar/ars408/scan              # radar_msgs/RadarScan
  track_topic: /sensing/radar/ars408/objects          # radar_msgs/RadarTracks
  marker_topic: /sensing/radar/ars408/object_markers
  sensor_id: 1003
  far:  {fov_deg: 9.0,  max_range: 250.0, range_res: 1.79, az_res_deg: 1.6, range_std: 0.20, az_std_deg: 0.1}
  near: {fov_deg: 60.0, max_range: 70.0,  range_res: 0.39, az_res_deg: 3.2, range_std: 0.05, az_std_deg: 0.3,
         wide_fov_deg: 45.0, wide_max_range: 40.0}   # |az|>45°는 40m까지
  elevation_fov_deg: 14.0
  ray_az_step_deg: 0.25
  ray_el_step_deg: 1.0
  velocity_std: 0.1
  max_clusters: 250

camera:
  enabled: true
  rate_hz: 10.0           # 실기 50fps. CPU 여유 있으면 올릴 것
  image_topic: /sensing/camera/arducam/image_raw
  info_topic: /sensing/camera/arducam/camera_info
  optical_frame: camera_optical_link
  gt_topic: /ground_truth/camera/arducam/labels   # 정답 라벨 영상 mono8 (픽셀 = 라벨 번호, 라이다 정답과 같은 번호). Godot 화면에서만
  gt_classes: [lane_white, lane_yellow]           # 라벨 영상에 남길 종류 (나머지는 0). 가려진 차선은 0. 비우면 전부
  gt_enabled: true
  width: 1920
  height: 1200
  # 임시 내부 파라미터: 3.6mm / 3.0um → f = 1200px. 왜곡은 데이터시트 HFOV 82°에 맞춘 추정값.
  # 실측 체커보드 캘리브레이션 값으로 교체할 것.
  K: [1200.0, 0.0, 960.0, 0.0, 1200.0, 600.0, 0.0, 0.0, 1.0]
  D: [-0.105, 0.0, 0.0, 0.0, 0.0]
  encoding: rgb8          # 실기 출력은 YUY2. RViz 확인 편의상 rgb8
  near: 0.05
  far: 800.0
