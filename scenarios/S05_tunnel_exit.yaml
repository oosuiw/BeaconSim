# 터널 출구 직전 사고 — 비콘이 터널 밖으로 전개, 재수렴
# beacon_script: ROS 상위 제어기 대신 쓰는 자리표시 명령 (--ros 로 /cmd_vel 이 들어오면 그쪽 우선)
# criteria 값은 예시입니다 (계획서 6장: 합격 기준 미정 → 실차 요구사항에서 역산해 수정)
name: S05_tunnel_exit
description: 터널 출구 직전 사고 — 비콘이 터널 밖으로 전개, 재수렴
duration: 150
map:
  seed: 7
scenario:
  seed: 105
  accident_where: tunnel_exit
environment:
  seed: 5
  time_of_day: day
  weather: clear
beacon_script:
- t0: 5
  t1: 80
  v: 2.0
  w: 0.0
criteria:
  max_beacon_hits: 0
  beacon_not_damaged: true
  min_ttc_s: 2.0
  max_beacon_contacts: 0
  max_gnss_reconverge_s: 60.0
